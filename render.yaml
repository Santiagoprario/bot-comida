services:
  - type: web
    name: menu-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn menu_bot.web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: DAILY_SEND_HOUR
        value: "8"
      - key: DAILY_SEND_MINUTE
        value: "0"
      - key: SEED_PATH
        value: data/default_seed.json
      - key: ALLOWED_CHAT_ID
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
      - key: DASHBOARD_PIN
        sync: false
      - key: WEATHER_LATITUDE
        value: "-38.0055"
      - key: WEATHER_LONGITUDE
        value: "-57.5426"
      - key: WEATHER_TIMEZONE
        value: America/Argentina/Buenos_Aires
